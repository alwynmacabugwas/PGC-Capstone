<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PGC INVENTORY - Sign Up</title>

    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../frontend/sidebar.css">
    <link rel="stylesheet" href="signupPage.css">
</head>

<body>
    <!--Outer Div for the whole page-->
    <div class="box-form">
        <!--right side of the page (now on the left)-->
        <div class="right">
            <div class="overlay">
                <h1>
                    PGC<br>
                    INVENTORY<br>
                    SYSTEM<br>
                </h1>
            </div>

            <div class="logo-container">
                <img src="C:/Users/Lenovo/Pictures/PGC logo.png" alt="Image">
            </div>
        </div>

        <!--left side of the page (now on the right)-->
        <div class="left">
            <h2>SIGN UP</h2>
            <div class="inputs">
                <input type="text" id="input-username" placeholder="Username">
                <input type="email" id="input-name" placeholder="Name">
                <input type="password" id="input-department" placeholder="Department">
                <input type="password" id="input-password" placeholder="Password">
            </div>

            <button class="signup-button" id="signup-button">Register</button>

            <p class="login-link">
                Already have an account? <a href="../../frontend/login_pages/loginPage.html">Log in</a>
            </p>
        </div>
    </div>

    <script src="signupPage.js"></script>
</body>

</html>
